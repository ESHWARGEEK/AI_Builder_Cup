# ── Monorepo Root Cloud Build Pipeline ──
# Orchestrates test, build, and zero-downtime deployment of EKA Backend and Frontend

steps:
  # ── Backend Phase ──
  - name: 'python:3.11-slim'
    id: 'backend-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r backend/requirements.txt pytest pytest-asyncio
        pytest backend/tests/ -v --tb=short

  - name: 'gcr.io/cloud-builders/docker'
    id: 'backend-build'
    waitFor: ['backend-test']
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/eka-repo/eka-backend:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/eka-repo/eka-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'backend-push'
    waitFor: ['backend-build']
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/eka-repo/eka-backend:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'backend-deploy'
    waitFor: ['backend-push']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'eka-backend'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/eka-repo/eka-backend:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--service-account=eka-backend-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--concurrency=80'
      - '--vpc-connector=eka-vpc-connector'
      - '--set-env-vars=ENVIRONMENT=production,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=$_REGION,MODEL_ARMOR_ENABLED=true'

  # ── Frontend Phase ──
  - name: 'node:20-slim'
    id: 'frontend-build-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd frontend
        npm ci
        npx tsc --noEmit
        npm run build

  - name: 'gcr.io/cloud-builders/docker'
    id: 'frontend-build'
    waitFor: ['frontend-build-check']
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/eka-repo/eka-frontend:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/eka-repo/eka-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'frontend-push'
    waitFor: ['frontend-build']
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/eka-repo/eka-frontend:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'frontend-deploy'
    waitFor: ['frontend-push', 'backend-deploy']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'eka-frontend'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/eka-repo/eka-frontend:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--concurrency=100'

substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
